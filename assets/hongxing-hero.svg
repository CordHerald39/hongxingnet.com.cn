<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
<title>红杏云品牌纸雕插画</title>
<desc>杏果与打开的拱门，象征从容进入新的空间。 原创可编辑矢量图，无外部素材。</desc>
<defs>
  <linearGradient id="hongxing-paper" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#f7f9f8"/><stop offset="1" stop-color="#e5ebe7"/></linearGradient>
  <linearGradient id="hongxing-accent" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#d99f9b"/><stop offset="1" stop-color="#b4433b"/></linearGradient>
  <linearGradient id="hongxing-accentSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6e8e7"/><stop offset=".5" stop-color="#ecd0ce"/><stop offset="1" stop-color="#d89d99"/></linearGradient>
